name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify public repository, tag, and signing configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $rootVersion = (Get-Content package.json | ConvertFrom-Json).version
          if (('v' + $version) -ne '${{ github.ref_name }}' -or $rootVersion -ne $version) { throw 'Tag must match both package versions' }
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Production signing secrets are required' }
          $repo = gh api "repos/${{ github.repository }}" | ConvertFrom-Json
          if ($repo.private) { throw 'Update releases require a public GitHub repository' }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check and build
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bun run build
      - name: Build signed installer and update metadata
        working-directory: apps/desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: bunx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never -c.forceCodeSigning=true
      - name: Verify release files
        shell: pwsh
        run: |
          $release = 'apps/desktop/release'
          $installer = Get-ChildItem $release -Filter '*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          if (-not (Test-Path "$release/latest.yml")) { throw 'latest.yml missing' }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'Blockmap missing' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature invalid: $($signature.Status)" }
      - name: Publish public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = 'apps/desktop/release'
          $installer = Get-ChildItem $release -Filter '*-x64.exe' | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $installer.FullName "$($installer.FullName).blockmap" "$release/latest.yml" --title '${{ github.ref_name }}' --generate-notes --verify-tag
